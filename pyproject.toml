[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercomplex-engine" 
version = "0.0.4"
authors = [
  { name="Maher Ben Abdessalem", email="ba.maher94@gmail.com" },
]
description = "Fast O(1)/O(n) multiplication engine and table generator for ordinary, split, and dual Cayley-Dickson algebras."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0"
]
keywords = [
    "hypercomplex", "cayley-dickson", "quaternions", "octonions", 
    "split-algebra", "math", "physics", "geometry"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/maher1719/hypercomplex-engine"
"Repository" = "https://github.com/maher1719/hypercomplex-engine"
"Preprint: Sign Structure" = "https://doi.org/10.6084/m9.figshare.33705022"
#"Preprint: Exponential Law" = "https://doi.org/10.5281/zenodo.17575548"

# CRITICAL: This prevents tests/ and examples/ from being packaged
[tool.setuptools.packages.find]
include = ["hypercomplex*"]
exclude = ["tests*", "examples*"]

